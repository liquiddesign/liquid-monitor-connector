name: lqcron

# Rust plánovač `scheduler/` (docs/v4-local-scheduler.md): fmt, clippy, testy
# (vč. integračního testu s PHP a shody cron výrazů s dragonmantank/cron-expression)
# a zkušební build statických binárek.

on:
  push:
    branches: [ 4.x ]
    paths:
      - 'scheduler/**'
      - 'bin/**'
      - 'src/Scheduler/**'
      - 'src/Worker/**'
      - 'tests/Lqcron*'
      - 'tests/fixtures/**'
      - 'composer.json'
      - '.github/workflows/lqcron.yml'
  pull_request:
    branches: [ 4.x ]
    paths:
      - 'scheduler/**'
      - 'bin/**'
      - 'src/Scheduler/**'
      - 'src/Worker/**'
      - 'tests/Lqcron*'
      - 'tests/fixtures/**'
      - 'composer.json'
      - '.github/workflows/lqcron.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler

      # integrační test spouští fake `monitor-worker` v PHP (sqlite3), parity test
      # porovnává výrazy s vendor/dragonmantank/cron-expression
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite

      - name: Composer install
        working-directory: .
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        env:
          LQCRON_REQUIRE_PHP: '1'
        run: cargo test --locked

      - name: Wrapper syntax
        working-directory: .
        run: sh -n bin/lqcron

      # Verze binárky = verze balíčku (plán § 3): Cargo.toml a Version::CURRENT se mění spolu
      - name: Cargo version matches Version::CURRENT
        working-directory: .
        run: |
          cargo_version=$(sed -nE 's/^version = "(.*)"/\1/p' scheduler/Cargo.toml | head -1)
          php_version=$(php -r 'require "src/Version.php"; echo LiquidMonitorConnector\Version::CURRENT;')
          echo "Cargo.toml $cargo_version, Version::CURRENT $php_version"
          test "$cargo_version" = "$php_version"

      # Skutečná binárka (debug build z cargo test) proti skutečné PHP straně connectoru
      # PHP strana zapisuje do SQLite přes oba drivery (SqliteConnection::open
      # respektuje LQCRON_PHP_SQLITE_DRIVER) — e2e projde s každým zvlášť.
      - name: End-to-end test (lqcron + PHP connector, both SQLite drivers)
        working-directory: .
        env:
          LQCRON_BINARY: ${{ github.workspace }}/scheduler/target/debug/lqcron
          XDG_STATE_HOME: ${{ runner.temp }}/xdg
        run: |
          for driver in sqlite3 pdo_sqlite; do
            echo "::group::LQCRON_PHP_SQLITE_DRIVER=$driver"
            mkdir -p "$RUNNER_TEMP/tester-$driver"
            LQCRON_PHP_SQLITE_DRIVER=$driver TMPDIR="$RUNNER_TEMP/tester-$driver" \
              vendor/bin/tester tests/LqcronEndToEnd.phpt -s -C --temp "$RUNNER_TEMP/tester-$driver"
            echo "::endgroup::"
          done

  build:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      - name: Build static binaries
        run: |
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
          cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      - name: Size check (target 5 MB, hard limit 10 MB — plán § 3)
        run: |
          for t in x86_64 aarch64; do
            f=target/$t-unknown-linux-musl/release/lqcron
            size=$(stat -c %s "$f")
            echo "$t: $size B"
            if [ "$size" -gt 10485760 ]; then echo "::error::$t binary is over 10 MB — switch to release assets (plán § 3)"; exit 1; fi
            if [ "$size" -gt 5242880 ]; then echo "::warning::$t binary is over the 5 MB target"; fi
          done
          ./target/x86_64-unknown-linux-musl/release/lqcron --version
