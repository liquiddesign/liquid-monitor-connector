name: Analysis

on:
  push:
    branches: [ main, 3.x, 4.x ]
  pull_request:
    branches: [ main, 3.x, 4.x ]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP Action
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: CRLF
        run: |
          git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - name: Validate composer.json
        run: composer validate

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run phpstan
        run: composer phpstan

      - name: Run phpcs
        run: composer phpcs

      - uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: failure()

  # Testy (nette/tester) na všech podporovaných verzích PHP (plán § 3, Příloha A — 4.0 drží PHP >= 8.0).
  # Tester se pouští s -C, aby viděl rozšíření zapnutá v php.ini (sqlite3 / pdo_sqlite).
  # tests/LqcronEndToEnd.phpt se tu bez binárky přeskočí; s binárkou běží v lqcron.yml.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            deps: highest
          - php: '8.0'
            deps: lowest
          - php: '8.1'
            deps: highest
          - php: '8.3'
            deps: highest
          - php: '8.5'
            deps: highest
    name: tests (PHP ${{ matrix.php }}, ${{ matrix.deps }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, pcntl, posix
          coverage: none

      - name: Install dependencies (highest)
        if: matrix.deps == 'highest'
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Install dependencies (lowest)
        if: matrix.deps == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction

      # PHP 8.0 parserem jde analyzovat jen vendor/ nainstalovaný pro 8.0 (phpstan-php80.neon);
      # hlavní PHPStan job výše zůstává na phpstan.neon.
      - name: Run phpstan (PHP 8.0)
        if: matrix.php == '8.0' && matrix.deps == 'lowest'
        run: vendor/bin/phpstan analyse --memory-limit 1G -c phpstan-php80.neon

      # Vlastní temp mimo sdílený /tmp/Tester (jinak proc_open: Permission denied).
      # PHP strana scheduleru umí oba SQLite drivery; testy běží s každým.
      - name: Run tests (sqlite3 + pdo_sqlite)
        run: |
          for driver in sqlite3 pdo_sqlite; do
            echo "::group::LQCRON_PHP_SQLITE_DRIVER=$driver"
            mkdir -p "$RUNNER_TEMP/tester-$driver"
            LQCRON_PHP_SQLITE_DRIVER=$driver TMPDIR="$RUNNER_TEMP/tester-$driver" \
              vendor/bin/tester tests -s -C --temp "$RUNNER_TEMP/tester-$driver"
            echo "::endgroup::"
          done
